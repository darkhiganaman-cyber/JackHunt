# Имя мира должно совпадать с именем папки мира.
world: world

# Радиус выбирается случайно для каждой попытки: 1000–5000 блоков от центра.
min-radius: 1000
max-radius: 5000

# Центр по умолчанию — точка спавна мира. Команда /jack setcenter задаёт центр
# по текущему местоположению администратора и сохраняет его в config.yml.
center:
  x: 0
  z: 0

# Интервал между раундами после победы или окончания таймера, в минутах.
interval-minutes: 60
round-timeout-minutes: 10

# Количество попыток подобрать безопасную точку перед отменой раунда.
location-attempts: 80
